name: Visual Regression

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start preview server
        run: npx vite preview --port 4173 --host &
        shell: bash

      - name: Wait for server
        run: sleep 5 && curl -f http://localhost:4173

      - name: Run visual regression (baseline)
        run: npm run shoot
        env:
          SHOOT_URL: http://localhost:4173
        continue-on-error: true

      - name: Compare with baseline
        if: github.event_name == 'pull_request'
        run: |
          # This would integrate with a visual regression service like Chromatic or Percy
          # For now, we just ensure the shoot script runs successfully
          echo "Visual regression baseline captured"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-${{ github.sha }}
          path: shots/
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const shotsDir = 'shots';
            if (fs.existsSync(shotsDir)) {
              const files = fs.readdirSync(shotsDir).filter(f => f.endsWith('.png'));
              const comment = `## 📸 Visual Regression Screenshots\n\n${files.map(f => `![${f}](shots/${f})`).join('\n\n')}\n\n*Captured at commit ${process.env.GITHUB_SHA?.slice(0, 7)}*`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }